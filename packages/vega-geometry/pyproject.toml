[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-geometry"
version = "0.2.0"
description = "Component interfaces, connected geometry recipes and hollow station lofts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vega_geometry*"]
